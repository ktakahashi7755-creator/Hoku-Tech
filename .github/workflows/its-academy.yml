name: its-academy

on:
  push:
    paths: ["its-academy/**", ".github/workflows/its-academy.yml"]
  pull_request:
    paths: ["its-academy/**", ".github/workflows/its-academy.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: its-academy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: its
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: its_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U its -d its_academy_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://its:ci_only_password@localhost:5432/its_academy_test
      TEST_DATABASE_URL: postgresql://its:ci_only_password@localhost:5432/its_academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: its-academy/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: its-academy/content/code/**/pom.xml
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install Chromium for browser-based checks
        run: npx playwright install --with-deps chromium
      - name: Verify lesson code samples (Java / bash / SQL / Maven / browser, compared with published output)
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          npm run verify:code
      - name: Build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e -- --trace off

  cross-browser:
    # Firefox と WebKit (Safari のエンジン) で E2E を実行する
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    defaults:
      run:
        working-directory: its-academy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: its
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: its_academy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U its -d its_academy_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://its:ci_only_password@localhost:5432/its_academy_test
      TEST_DATABASE_URL: postgresql://its:ci_only_password@localhost:5432/its_academy_test
      PW_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: its-academy/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 10
      - name: E2E (${{ matrix.browser }})
        run: npm run test:e2e -- --trace off

  container:
    # Dockerfile / docker-compose.yml を本番と同じ設定 (APP_ENV=production, COOKIE_SECURE=true) で起動し、
    # ヘルスチェック・セキュリティヘッダー・危険な設定での起動拒否・バックアップと復元を確認する
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: its-academy
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Health and headers
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          headers="$(curl -sI http://127.0.0.1:3000/login)"
          echo "$headers"
          for h in Content-Security-Policy Strict-Transport-Security X-Frame-Options X-Content-Type-Options; do
            echo "$headers" | grep -qi "^$h:" || { echo "missing $h"; exit 1; }
          done
          if echo "$headers" | grep -qi '^x-powered-by:'; then echo "x-powered-by present"; exit 1; fi
      - name: Refuse unsafe configuration
        run: |
          set +e
          timeout 60 docker run --rm -e DATABASE_URL='postgresql://its:its_dev_only@db:5432/x' its-academy
          code=$?
          set -e
          test "$code" = 1
      - name: Production bootstrap
        # 出力に初回パスワードが含まれるため、ログには出さない
        run: |
          BOOTSTRAP_ADMIN_EMAIL=owner@its.example docker compose --profile setup run --rm -T bootstrap > bootstrap1.log
          grep -q "教材を登録しました" bootstrap1.log && grep -q "システム管理者を作成しました" bootstrap1.log
          docker compose --profile setup run --rm -T bootstrap > bootstrap2.log
          grep -q "教材は登録済み" bootstrap2.log && grep -q "システム管理者は作成済み" bootstrap2.log
          rm -f bootstrap1.log bootstrap2.log
          test "$(docker compose exec -T db psql -U its -d its_academy -Atc 'SELECT count(*) FROM lessons')" = 35
          test "$(docker compose exec -T db psql -U its -d its_academy -Atc 'SELECT count(*) FROM enrollments')" = 0
      - name: Backup and restore
        run: |
          . ./.env
          net="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q db)")"
          url="postgresql://its:$POSTGRES_PASSWORD@db:5432"
          mkdir -p backups
          pg() { docker run --rm --network "$net" -v "$PWD/scripts:/scripts:ro" -v "$PWD/backups:/backups" -e BACKUP_DIR=/backups -e RESTORE_CONFIRM=yes "$@"; }
          pg -e DATABASE_URL="$url/its_academy" postgres:16 /scripts/backup.sh
          docker compose exec -T db psql -U its -d its_academy -c 'CREATE DATABASE its_academy_restore'
          pg -e DATABASE_URL="$url/its_academy_restore" postgres:16 sh -c '/scripts/restore.sh /backups/its_academy-*.dump'
          q="SELECT count(*) FROM _prisma_migrations"
          a="$(docker compose exec -T db psql -U its -d its_academy -Atc "$q")"
          b="$(docker compose exec -T db psql -U its -d its_academy_restore -Atc "$q")"
          echo "migrations: $a / restored: $b"; test "$a" = "$b" && test "$a" -gt 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Stop stack
        if: always()
        run: docker compose down -v
