name: project-sheet

# 進捗の文書・教材が変わったら、チームのスプレッドシート (WBS・タスク・スケジュール・カリキュラム) の中身を作り直す。
# 標準: publish-data がデータを公開し、スプレッドシートの Apps Script が読み込む (鍵は不要。docs/project-sheet.md §3)
# 別の方法: sync がサービスアカウントで直接書き込む。次の設定があるときだけ動く (§6)
#   Secrets   GOOGLE_SERVICE_ACCOUNT_KEY  サービスアカウントの鍵 (JSON)
#   Variables PROJECT_SHEET_ID            スプレッドシートの ID
#             PROJECT_SHEET_BRANCH        反映するブランチ (省略時はデフォルトブランチ)

on:
  push:
    paths:
      - "docs/**"
      - "its-academy/content/**"
      - "its-academy/scripts/project-sheet.ts"
      - "its-academy/scripts/project-sheet/**"
      - ".github/workflows/project-sheet.yml"
  workflow_dispatch:
  schedule:
    # 毎日 6:17 (日本時間)。GitHub の定時実行は、デフォルトブランチにあるこのファイルからだけ動く
    - cron: "17 21 * * *"

permissions:
  contents: read

# 書き込みが重ならないよう、1 つずつ順に実行する (書き込みの途中で止めないよう、実行中のものは取り消さない)
concurrency:
  group: project-sheet
  cancel-in-progress: false

jobs:
  # スプレッドシートの Apps Script が読み込むデータを、ブランチ project-sheet-data に公開する (鍵は不要)。
  # ファイル名はブランチ名の / を __ にしたもの (例: claude__sharp-bohr-4wbemd.json)
  publish-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # project-sheet-data ブランチへの書き込みだけに使う
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 実績の日付 (タスクを記録した日) を git の履歴から取るため
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: its-academy/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: its-academy
      - name: Build data
        run: npm run sheet -- --json "$RUNNER_TEMP/project-sheet.json"
        working-directory: its-academy
      - name: Publish to the project-sheet-data branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          file="$(printf '%s' "$BRANCH_NAME" | sed 's#/#__#g').json"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUNNER_TEMP/data"
          if git ls-remote --exit-code --heads origin project-sheet-data >/dev/null; then
            git fetch --depth=1 origin project-sheet-data
            git worktree add -B project-sheet-data "$dir" origin/project-sheet-data
          else
            git worktree add --orphan -b project-sheet-data "$dir"
          fi
          cd "$dir"
          cp "$RUNNER_TEMP/project-sheet.json" "$file"
          printf '%s\n' "# project-sheet-data" "" "チームのスプレッドシート (Apps Script) が読み込むデータ。GitHub Actions (project-sheet) が自動で更新する。手で編集しない。" "元の文書と手順: docs/project-sheet.md" > README.md
          git add -A
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "data: update $file"
          for i in 1 2 3; do
            git push origin project-sheet-data && exit 0
            sleep $((i * 5))
            git fetch --depth=1 origin project-sheet-data && git rebase origin/project-sheet-data
          done
          exit 1

  # (別の方法) サービスアカウントの鍵で、Sheets API から直接書き込む。Secrets を設定したときだけ動く
  sync:
    # push は反映するブランチへのものだけ。定時・手動の実行は、反映するブランチを取り出して使う
    if: github.event_name != 'push' || github.ref_name == (vars.PROJECT_SHEET_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: its-academy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ vars.PROJECT_SHEET_BRANCH }} # 空ならイベントのブランチ (定時ならデフォルトブランチ)
          fetch-depth: 0 # 実績の日付 (タスクを記録した日) を git の履歴から取るため
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: its-academy/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build tabs (check)
        run: npm run sheet -- --out ../sheet-preview
      - name: Update the spreadsheet
        env:
          PROJECT_SHEET_ID: ${{ vars.PROJECT_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run sheet -- --push
